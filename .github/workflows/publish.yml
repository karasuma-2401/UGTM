name: Publish Images
on:
  push:
    branches: [dev, production]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild every component including base image updates
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      verify_image: false
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      infrastructure: ${{ steps.plan.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find the last trusted manifest on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous
          run=$(gh run list --workflow publish.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -n "$run" ]]; then
            # An expired artifact means a full build, never an unverified reuse.
            attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .run_attempt)
            gh run download "$run" --name "release-bundle-$attempt" --dir previous || rm -f previous/release.json
          fi
      - id: plan
        env:
          FORCE: ${{ inputs.force_rebuild || github.event_name == 'schedule' }}
          AMD64: ${{ vars.BUILD_AMD64 || 'true' }}
        run: |
          args=()
          [[ "$FORCE" != true ]] || args+=(--force)
          [[ "$AMD64" != true ]] || args+=(--amd64)
          matrix=$(python scripts/release.py plan --previous previous/release.json "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          policy=json.load(open('docker/release-policy.json'))
          print('infrastructure='+json.dumps({'include':[{'component':name,'image':image} for name,image in policy['infrastructure'].items()]}))
          PY
  infrastructure-scan:
    needs: [checks, plan]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.infrastructure) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.76.2
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          name: infrastructure-scan-${{ matrix.component }}-${{ github.run_attempt }}
          path: trivy.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-infrastructure-${{ matrix.component }}-arm64
  build:
    needs: [checks, plan]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ugtm-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - name: Build once on the native architecture
        id: build
        if: ${{ !matrix.reuse }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Validate the exact gateway image
        if: matrix.component == 'gateway'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ matrix.reuse && matrix.digest || steps.build.outputs.digest }}
        run: |
          docker run --rm --platform "linux/${{ matrix.arch }}" --network none \
            -e API_HOST=api.example.test \
            -e APP_URL=https://frontend.example.test \
            -e ACME_EMAIL=ops@example.test \
            -v "$GITHUB_WORKSPACE/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$IMAGE" caddy validate --config /etc/caddy/Caddyfile
      - name: Scan the exact platform digest (also re-scan reused images)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          version: v0.76.2
          image-ref: ${{ steps.image.outputs.name }}@${{ matrix.reuse && matrix.digest || steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          name: scan-${{ matrix.component }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: trivy.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.component }}-${{ matrix.arch }}
      - name: Record a successful platform scan
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ matrix.reuse && matrix.digest || steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          INPUT_HASH: ${{ matrix.input_hash }}
          BUILT_FROM: ${{ matrix.built_from }}
          BUILT_AT: ${{ matrix.built_at }}
        run: |
          python - <<'PY'
          import json, os
          record = {key.lower(): os.environ[key] for key in ('COMPONENT','ARCH','DIGEST','INPUT_HASH','BUILT_FROM','BUILT_AT')}
          record['image'] = os.environ['IMAGE']
          with open(f"{record['component']}-{record['arch']}.json", 'w') as file:
              json.dump(record, file)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-${{ matrix.component }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ matrix.component }}-${{ matrix.arch }}.json
  release:
    needs: [build, infrastructure-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-*-${{ github.run_attempt }}
          path: records
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble scanned manifests without rebuilding
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          for component in ('api', 'ai', 'gateway'):
              paths = list(pathlib.Path('records').glob(f'{component}-*.json'))
              items = [json.loads(p.read_text()) for p in paths]
              image = items[0]['image']
              tag = f"{image}:release-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
              subprocess.run(['docker','buildx','imagetools','create','--tag',tag,
                              *[f"{image}@{r['digest']}" for r in items]], check=True)
              digest = subprocess.check_output(['docker','buildx','imagetools','inspect',tag,'--format','{{json .Manifest.Digest}}'], text=True)
              reference = f'{image}@{json.loads(digest)}'
              for path, item in zip(paths, items):
                  item['reference'] = reference
                  path.write_text(json.dumps(item))
          PY
      - name: Seal the release bundle
        run: |
          mkdir -p bundle/scripts bundle/docker
          python scripts/release.py manifest --records records --output bundle/release.json
          cp scripts/release.py scripts/Deploy-Production.sh scripts/production_*.py scripts/Backup-Production.sh scripts/Restore-Drill.sh bundle/scripts/
          cp docker/docker-compose.prod.yml docker/Caddyfile docker/initialize-minio.sh bundle/docker/
          python scripts/release.py seal bundle
          python scripts/release.py verify bundle
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          release = json.load(open('bundle/release.json'))
          print(f"Release `{release['source_sha']}` — {release['branch']}")
          for name, image in release['images'].items():
              print(f"\n* {name}: `{image['reference']}` (built from `{image['built_from']}`)")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: bundle/
          retention-days: 90
