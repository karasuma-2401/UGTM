name: Publish Images

on:
  push:
    branches:
      - dev
      - production
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Custom image tag override (optional)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: Require both CI workflows for this commit
    if: contains(fromJSON('["dev", "production"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Wait for successful backend and frontend push runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['backend-ci.yml', 'frontend-ci.yml'];
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 150; attempt++) {
              let allPassed = true;
              for (const workflow_id of workflows) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id, head_sha: context.sha,
                  branch: context.ref.replace('refs/heads/', ''), event: 'push', per_page: 100
                });
                const run = data.workflow_runs.sort((a, b) => b.run_number - a.run_number)[0];
                if (!run || run.status !== 'completed') {
                  allPassed = false;
                  continue;
                }
                if (run.conclusion !== 'success') {
                  core.setFailed(`${workflow_id} failed for ${context.sha}: ${run.conclusion}`);
                  return;
                }
              }
              if (allPassed) return;
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed(`Timed out waiting for both CI workflows on ${context.sha}`);

  publish:
    name: Build, Scan & Publish
    needs: ci-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ugtm-api
            context: backend
            dockerfile: backend/host/Api/Dockerfile
          - image: ugtm-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Tags
        id: tags
        env:
          CUSTOM_TAG: ${{ inputs.image_tag }}
        run: |
          SHA="${GITHUB_SHA}"
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${SHA:0:7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${OWNER}/${{ matrix.image }}"

          if [ -n "${CUSTOM_TAG}" ]; then
            FLOATING_TAG="${CUSTOM_TAG}"
          else
            FLOATING_TAG="${BRANCH}"
          fi

          SCAN_TAG="ghcr.io/${IMAGE_NAME}:scan-${SHORT_SHA}"
          PUSH_TAGS="ghcr.io/${IMAGE_NAME}:${FLOATING_TAG},ghcr.io/${IMAGE_NAME}:sha-${SHA}"
          if [ "${BRANCH}" = "production" ]; then
            PUSH_TAGS="${PUSH_TAGS},ghcr.io/${IMAGE_NAME}:latest"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "scan_tag=${SCAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "push_tags=${PUSH_TAGS}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.tags.outputs.scan_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          version: "v0.76.2"
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          # Otherwise the action unsets severity for SARIF and gates every level.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 1
          hide-progress: true

      - name: Preserve Trivy report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}-attempt-${{ github.run_attempt }}
          path: trivy-results.sarif
          retention-days: 7

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-${{ matrix.image }}"

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.push_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
