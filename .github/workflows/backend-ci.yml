name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - production
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".env.example"
      - "UGTM.sln"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify code formatting
        run: dotnet format UGTM.sln --verify-no-changes --verbosity diagnostic

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'UGTM.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore UGTM.sln

      - name: Build solution
        run: dotnet build UGTM.sln -c Release --no-restore /nr:false

      - name: Execute tests (Architecture, Unit & Integration)
        run: dotnet test UGTM.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  docker-verify:
    name: Docker Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f backend/host/Api/Dockerfile backend

      - name: Validate production Compose configuration
        env:
          ACME_EMAIL: ops@example.test
          API_HOST: api.example.test
          APP_URL: https://frontend.example.test
          DATABASE_CONNECTION_STRING: Host=database;Database=ugtm;Username=ugtm;Password=ci-only
          IDENTITY_IP_HASH_KEY: ci-only-identity-ip-hash-key-32-characters
          JWT_PRIVATE_KEY_FILE: /tmp/ci-only-jwt-private.pem
          SMTP_HOST: smtp.example.test
          SMTP_FROM_ADDRESS: no-reply@example.test
          PLAGIARISM_AI_BASE_URL: https://ai.example.test
          THESIS_EMAIL_OUTBOX_PARTITION: ci-only
          S3_ENDPOINT: https://storage.example.test
          S3_ACCESS_KEY: ci-only
          S3_SECRET_KEY: ci-only
          S3_BUCKET_NAME: ci-only
        run: docker compose -f docker/docker-compose.prod.yml config --quiet

      - name: Validate Caddy gateway configuration
        run: >-
          docker run --rm
          -e API_HOST=api.example.test
          -e ACME_EMAIL=ops@example.test
          -v "${{ github.workspace }}/docker/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile
