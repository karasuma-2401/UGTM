name: Backend CI

on:
  workflow_call:
    inputs:
      verify_image:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      verify_image:
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Verify code formatting
        run: dotnet format UGTM.sln --verify-no-changes --verbosity diagnostic

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings remain in the summary/artifact; this workflow has read-only PR access.
          GITLEAKS_ENABLE_COMMENTS: "false"

  test:
    name: Run Tests
    needs: format
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'UGTM.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore UGTM.sln

      - name: Build solution
        run: dotnet build UGTM.sln -c Release --no-restore /nr:false

      - name: Build and validate the patched gateway
        if: ${{ inputs.verify_image }}
        run: |
          docker build -t ugtm-gateway-ci docker/gateway
          docker run --rm --network none \
            -e API_HOST=api.example.test \
            -e APP_URL=https://frontend.example.test \
            -e ACME_EMAIL=ops@example.test \
            -v "$GITHUB_WORKSPACE/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            ugtm-gateway-ci caddy validate --config /etc/caddy/Caddyfile

      - name: Scan the patched gateway before merge
        if: ${{ inputs.verify_image }}
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          image-ref: ugtm-gateway-ci
          format: sarif
          output: gateway.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload gateway scan report
        if: always() && hashFiles('gateway.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-pr-scan
          path: gateway.sarif
          retention-days: 30

      - name: Execute tests (Architecture, Unit & Integration)
        env:
          UGTM_GATEWAY_TEST_IMAGE: ${{ inputs.verify_image && 'ugtm-gateway-ci' || '' }}
        run: dotnet test UGTM.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Verify read-only schema gate against a disposable database
        run: python scripts/tests/test_api_schema.py backend/host/Api/bin/Release/net10.0/UGTM.Api.dll

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  docker-verify:
    name: Docker Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build API Docker image
        if: ${{ inputs.verify_image }}
        run: docker build -f backend/host/Api/Dockerfile backend

      - name: Validate production Compose configuration
        env:
          ACME_EMAIL: ops@example.test
          API_HOST: api.example.test
          APP_URL: https://frontend.example.test
          DATABASE_CONNECTION_STRING: Host=database;Database=ugtm;Username=ugtm;Password=ci-only
          IDENTITY_IP_HASH_KEY: ci-only-identity-ip-hash-key-32-characters
          JWT_PRIVATE_KEY_FILE: /tmp/ci-only-jwt-private.pem
          SMTP_HOST: smtp.example.test
          SMTP_FROM_ADDRESS: no-reply@example.test
          API_IMAGE: ghcr.io/example/ugtm-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AI_IMAGE: ghcr.io/example/ugtm-ai@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GATEWAY_IMAGE: ghcr.io/example/ugtm-gateway@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          AI_POSTGRES_DSN: postgresql://ai:ci-only@database/ai
          AI_POSTGRES_DIRECT_DSN: postgresql://ai:ci-only@database/ai
          PLAGIARISM_AI_API_KEY: ci-only-internal-key-at-least-32-characters
          PLAGIARISM_AI_DEFAULT_CORPUS: ci-only
          REMOTE_GPU_URL: https://gpu.example.test
          REMOTE_GPU_API_KEY: ci-only
          AI_ARTIFACTS_DIR: /tmp/ci-only-ai-artifacts
          MINIO_ROOT_USER: ci-admin
          MINIO_ROOT_PASSWORD: ci-only-admin-password
          S3_ACCESS_KEY: ci-only
          S3_SECRET_KEY: ci-only
          S3_BUCKET_NAME: ci-only
          AI_S3_ACCESS_KEY: ci-only-ai
          AI_S3_SECRET_KEY: ci-only-ai-secret
        run: docker compose -f docker/docker-compose.prod.yml config --quiet

      - name: Resolve the reviewed MinIO image
        if: ${{ inputs.verify_image }}
        id: minio
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('image='+json.load(open('docker/release-policy.json'))['infrastructure']['minio'])
          PY

      - name: Scan MinIO before merge
        if: ${{ inputs.verify_image }}
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.76.2
          image-ref: ${{ steps.minio.outputs.image }}
          format: sarif
          output: minio.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload image scan reports
        if: always() && hashFiles('minio.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minio-pr-scan
          path: minio.sarif
          retention-days: 30
