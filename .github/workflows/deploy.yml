name: Deploy to VPS

on:
  workflow_run:
    workflows:
      - Publish Images
    types:
      - completed
    branches:
      - dev
      - production
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - production

jobs:
  deploy:
    name: Deploy via SSH
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify VPS Secrets
        id: check-secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          JWT_PRIVATE_KEY_PEM_BASE64: ${{ secrets.JWT_PRIVATE_KEY_PEM_BASE64 }}
          IDENTITY_IP_HASH_KEY: ${{ secrets.IDENTITY_IP_HASH_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$APP_URL" ] || \
             [ -z "$DATABASE_CONNECTION_STRING" ] || [ -z "$JWT_PRIVATE_KEY_PEM_BASE64" ] || \
             [ -z "$IDENTITY_IP_HASH_KEY" ] || [ "${#IDENTITY_IP_HASH_KEY}" -lt 32 ] || \
             [ -z "$SMTP_HOST" ] || [ -z "$SMTP_FROM_ADDRESS" ]; then
            echo "One or more required deployment secrets are not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notification
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "::warning ::Deployment skipped because required secrets are missing."
          echo "Configure VPS_HOST, VPS_SSH_KEY, APP_URL, DATABASE_CONNECTION_STRING, JWT_PRIVATE_KEY_PEM_BASE64, IDENTITY_IP_HASH_KEY (at least 32 characters), SMTP_HOST and SMTP_FROM_ADDRESS in GitHub Actions secrets."

      - name: Deploy to VPS via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          APP_URL: ${{ secrets.APP_URL }}
          JWT_PRIVATE_KEY_PEM_BASE64: ${{ secrets.JWT_PRIVATE_KEY_PEM_BASE64 }}
          IDENTITY_IP_HASH_KEY: ${{ secrets.IDENTITY_IP_HASH_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME || 'UGTM' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'StartTls' }}
          SMTP_TIMEOUT_SECONDS: ${{ secrets.SMTP_TIMEOUT_SECONDS || '30' }}
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DATABASE_CONNECTION_STRING,APP_URL,JWT_PRIVATE_KEY_PEM_BASE64,IDENTITY_IP_HASH_KEY,SMTP_HOST,SMTP_PORT,SMTP_FROM_ADDRESS,SMTP_FROM_NAME,SMTP_USERNAME,SMTP_PASSWORD,SMTP_SECURITY,SMTP_TIMEOUT_SECONDS,DEPLOY_GITHUB_TOKEN
          script: |
            set -e
            APP_DIR="$HOME/ugtm"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Determine image tag based on trigger
            BRANCH="${{ github.event_name == 'workflow_dispatch' && inputs.target_env || github.event.workflow_run.head_branch }}"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "Deploying UGTM (${BRANCH}) to VPS..."

            # Create or update docker-compose.prod.yml
            cat << 'EOF' > docker-compose.prod.yml
            services:
              backend:
                image: ghcr.io/${IMAGE_OWNER}/ugtm-api:${IMAGE_TAG}
                container_name: ugtm-backend
                restart: always
                environment:
                  - ASPNETCORE_ENVIRONMENT=Production
                  - ASPNETCORE_HTTP_PORTS=8080
                  - ConnectionStrings__DefaultConnection=${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING must be configured}
                  - Cors__AllowedOrigins__0=${APP_URL:?APP_URL must be configured}
                  - Identity__Email__PublicWebBaseUrl=${APP_URL:?APP_URL must be configured}
                  - Identity__DataProtection__KeyRingPath=/var/lib/ugtm/data-protection-keys
                  - Identity__ClientMetadata__IpHashKey=${IDENTITY_IP_HASH_KEY:?IDENTITY_IP_HASH_KEY must be configured}
                  - Proxy__KnownProxies__0=172.29.0.10
                  - Proxy__KnownProxies__1=::ffff:172.29.0.10
                  - Notifications__Smtp__Host=${SMTP_HOST}
                  - Notifications__Smtp__Port=${SMTP_PORT:-587}
                  - Notifications__Smtp__FromAddress=${SMTP_FROM_ADDRESS}
                  - Notifications__Smtp__FromName=${SMTP_FROM_NAME:-UGTM}
                  - Notifications__Smtp__Username=${SMTP_USERNAME}
                  - Notifications__Smtp__Password=${SMTP_PASSWORD}
                  - Notifications__Smtp__Security=${SMTP_SECURITY:-StartTls}
                  - Notifications__Smtp__TimeoutSeconds=${SMTP_TIMEOUT_SECONDS:-30}
                expose:
                  - "8080"
                volumes:
                  - data_protection_keys:/var/lib/ugtm/data-protection-keys
                  - ${JWT_PRIVATE_KEY_FILE}:/run/secrets/ugtm-jwt-private.pem:ro

              frontend:
                image: ghcr.io/${IMAGE_OWNER}/ugtm-frontend:${IMAGE_TAG}
                container_name: ugtm-frontend
                restart: always
                depends_on:
                  - backend
                networks:
                  default:
                    ipv4_address: 172.29.0.10
                ports:
                  - "80:80"

            volumes:
              data_protection_keys:

            networks:
              default:
                ipam:
                  config:
                    - subnet: 172.29.0.0/24
            EOF

            umask 077
            mkdir -p "$APP_DIR/secrets"
            printf '%s' "$JWT_PRIVATE_KEY_PEM_BASE64" | base64 --decode > "$APP_DIR/secrets/ugtm-jwt-private.pem"

            export IMAGE_OWNER="$OWNER"
            export IMAGE_TAG="$BRANCH"
            export JWT_PRIVATE_KEY_FILE="$APP_DIR/secrets/ugtm-jwt-private.pem"

            # Login to GHCR to pull images
            printf '%s' "$DEPLOY_GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull and restart containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean dangling images
            docker image prune -f
            echo "Deployment completed successfully!"
