name: Deploy to VPS
on:
  workflow_run:
    workflows: [Publish Images]
    types: [completed]
    branches: [production]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful production Publish Images run ID (not a commit SHA)
        required: true
        type: string
      deploy_mode:
        description: Prepare an immutable attempt, or deploy backend and Vercel together
        default: deploy
        type: choice
        options: [prepare, deploy]
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@66.2.0
      - name: Deploy the verified release
        env:
          PUBLISH_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.release_run_id || github.event.workflow_run.id }}
          AUTO_DEPLOY: ${{ github.event_name == 'workflow_run' }}
          DEPLOYMENT_SCOPE: ${{ vars.DEPLOYMENT_SCOPE }}
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SMOKE_AUTH_ENABLED: ${{ vars.SMOKE_AUTH_ENABLED || 'false' }}
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_FILE_ID: ${{ vars.SMOKE_FILE_ID }}
          SMOKE_FILE_SHA256: ${{ vars.SMOKE_FILE_SHA256 }}
          SMOKE_DENIED_PATH: ${{ vars.SMOKE_DENIED_PATH }}
          DEPLOY_MODE: ${{ inputs.deploy_mode || 'deploy' }}
          API_HOST: ${{ vars.API_HOST }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          AI_POSTGRES_DSN: ${{ secrets.AI_POSTGRES_DSN }}
          AI_POSTGRES_DIRECT_DSN: ${{ secrets.AI_POSTGRES_DIRECT_DSN }}
          PLAGIARISM_AI_API_KEY: ${{ secrets.PLAGIARISM_AI_API_KEY }}
          PLAGIARISM_AI_DEFAULT_CORPUS: ${{ vars.PLAGIARISM_AI_DEFAULT_CORPUS }}
          REMOTE_GPU_URL: ${{ secrets.REMOTE_GPU_URL }}
          REMOTE_GPU_API_KEY: ${{ secrets.REMOTE_GPU_API_KEY }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || 'ugtm-thesis-submissions' }}
          AI_S3_ACCESS_KEY: ${{ secrets.AI_S3_ACCESS_KEY }}
          AI_S3_SECRET_KEY: ${{ secrets.AI_S3_SECRET_KEY }}
          AI_S3_BUCKET_NAME: ${{ vars.AI_S3_BUCKET_NAME || 'ugtm-ai' }}
          MINIO_IMAGE: ${{ vars.MINIO_IMAGE }}
          MINIO_MC_IMAGE: ${{ vars.MINIO_MC_IMAGE }}
          AI_CLASSIFIER_ENABLED: ${{ vars.AI_CLASSIFIER_ENABLED || 'false' }}
          JWT_PRIVATE_KEY_PEM_BASE64: ${{ secrets.JWT_PRIVATE_KEY_PEM_BASE64 }}
          IDENTITY_IP_HASH_KEY: ${{ secrets.IDENTITY_IP_HASH_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME || 'UGTM' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'StartTls' }}
          SMTP_TIMEOUT_SECONDS: ${{ secrets.SMTP_TIMEOUT_SECONDS || '30' }}
          DATA_PROTECTION_VOLUME: ${{ vars.DATA_PROTECTION_VOLUME }}
          CADDY_DATA_VOLUME: ${{ vars.CADDY_DATA_VOLUME }}
          CADDY_CONFIG_VOLUME: ${{ vars.CADDY_CONFIG_VOLUME }}
          MINIO_DATA_VOLUME: ${{ vars.MINIO_DATA_VOLUME }}
        run: python scripts/production_pipeline.py
      - name: Release timings and recovery summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / f"ugtm-deploy-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          for name in ('summary.json', 'remote-status.json'):
              path = directory / name
              if path.exists():
                  print(f'```json\n{json.dumps(json.loads(path.read_text()), indent=2)}\n```')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ugtm-deploy-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/ugtm-deploy-${{ github.run_id }}-${{ github.run_attempt }}/remote-status.json
          retention-days: 90
