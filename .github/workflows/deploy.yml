name: Deploy to VPS

on:
  workflow_run:
    workflows: [Publish Images]
    types: [completed]
    branches: [production]
  workflow_dispatch:
    inputs:
      target_env:
        description: Target Environment
        required: true
        default: production
        type: choice
        options: [production]
      commit_sha:
        description: Full SHA of a tested release with all three published images
        required: true
        type: string
      deploy_mode:
        description: Prepare files/images only for the first data cutover, or deploy
        required: true
        default: deploy
        type: choice
        options: [prepare, deploy]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target_env == 'production') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'production')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Validate release and SSH configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOYMENT_SCOPE: ${{ vars.DEPLOYMENT_SCOPE }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA'; exit 1; }
          [[ -n "$VPS_HOST" && -n "$VPS_SSH_KEY" && "$DEPLOYMENT_SCOPE" == production ]] || {
            echo 'Configure production SSH secrets and DEPLOYMENT_SCOPE=production'; exit 1;
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Copy the versioned deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker/docker-compose.prod.yml,docker/Caddyfile,docker/initialize-minio.sh,scripts/Deploy-Production.sh
          target: ugtm/production/releases/${{ env.SOURCE_SHA }}
      - name: Deploy the verified release
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          DEPLOY_MODE: ${{ inputs.deploy_mode || 'deploy' }}
          API_HOST: ${{ vars.API_HOST }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          AI_POSTGRES_DSN: ${{ secrets.AI_POSTGRES_DSN }}
          AI_POSTGRES_DIRECT_DSN: ${{ secrets.AI_POSTGRES_DIRECT_DSN }}
          PLAGIARISM_AI_API_KEY: ${{ secrets.PLAGIARISM_AI_API_KEY }}
          PLAGIARISM_AI_DEFAULT_CORPUS: ${{ vars.PLAGIARISM_AI_DEFAULT_CORPUS }}
          REMOTE_GPU_URL: ${{ secrets.REMOTE_GPU_URL }}
          REMOTE_GPU_API_KEY: ${{ secrets.REMOTE_GPU_API_KEY }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || 'ugtm-thesis-submissions' }}
          AI_S3_ACCESS_KEY: ${{ secrets.AI_S3_ACCESS_KEY }}
          AI_S3_SECRET_KEY: ${{ secrets.AI_S3_SECRET_KEY }}
          AI_S3_BUCKET_NAME: ${{ vars.AI_S3_BUCKET_NAME || 'ugtm-ai' }}
          MINIO_IMAGE: ${{ vars.MINIO_IMAGE }}
          MINIO_MC_IMAGE: ${{ vars.MINIO_MC_IMAGE }}
          AI_CLASSIFIER_ENABLED: ${{ vars.AI_CLASSIFIER_ENABLED || 'false' }}
          JWT_PRIVATE_KEY_PEM_BASE64: ${{ secrets.JWT_PRIVATE_KEY_PEM_BASE64 }}
          IDENTITY_IP_HASH_KEY: ${{ secrets.IDENTITY_IP_HASH_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME || 'UGTM' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'StartTls' }}
          SMTP_TIMEOUT_SECONDS: ${{ secrets.SMTP_TIMEOUT_SECONDS || '30' }}
          DATA_PROTECTION_VOLUME: ${{ vars.DATA_PROTECTION_VOLUME }}
          CADDY_DATA_VOLUME: ${{ vars.CADDY_DATA_VOLUME }}
          CADDY_CONFIG_VOLUME: ${{ vars.CADDY_CONFIG_VOLUME }}
          MINIO_DATA_VOLUME: ${{ vars.MINIO_DATA_VOLUME }}
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: SOURCE_SHA,IMAGE_OWNER,DEPLOY_MODE,API_HOST,ACME_EMAIL,APP_URL,DATABASE_CONNECTION_STRING,AI_POSTGRES_DSN,AI_POSTGRES_DIRECT_DSN,PLAGIARISM_AI_API_KEY,PLAGIARISM_AI_DEFAULT_CORPUS,REMOTE_GPU_URL,REMOTE_GPU_API_KEY,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET_NAME,AI_S3_ACCESS_KEY,AI_S3_SECRET_KEY,AI_S3_BUCKET_NAME,MINIO_IMAGE,MINIO_MC_IMAGE,AI_CLASSIFIER_ENABLED,JWT_PRIVATE_KEY_PEM_BASE64,IDENTITY_IP_HASH_KEY,SMTP_HOST,SMTP_PORT,SMTP_FROM_ADDRESS,SMTP_FROM_NAME,SMTP_USERNAME,SMTP_PASSWORD,SMTP_SECURITY,SMTP_TIMEOUT_SECONDS,DATA_PROTECTION_VOLUME,CADDY_DATA_VOLUME,CADDY_CONFIG_VOLUME,MINIO_DATA_VOLUME,DEPLOY_GITHUB_TOKEN
          script: |
            set -eu
            export IMAGE_OWNER=$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
            bash "$HOME/ugtm/production/releases/$SOURCE_SHA/scripts/Deploy-Production.sh"
