name: AI CI

on:
  workflow_call:
    inputs:
      verify_image:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      verify_image:
        type: boolean
        default: true

permissions:
  contents: read

env:
  POSTGRES_DSN: postgresql://ugtm_ai:ci-only@localhost:5432/ugtm_ai
  POSTGRES_DIRECT_DSN: postgresql://ugtm_ai:ci-only@localhost:5432/ugtm_ai
  REDIS_URL: redis://localhost:6379/0
  API_KEY: ci-only-service-key
  INFERENCE_MODE: remote
  CLASSIFIER_ENABLED: "false"
  PYTHONUTF8: "1"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/plagiarism-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/plagiarism-ai/requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pytest -c pytest.unit.ini --junitxml=test-results/unit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-unit-results
          path: services/plagiarism-ai/test-results/*.xml

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ugtm_ai
          POSTGRES_USER: ugtm_ai
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ugtm_ai -d ugtm_ai"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/plagiarism-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/plagiarism-ai/requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - name: Migrate the disposable CI database only
        run: python -m scripts.migrate apply
      - run: python -m scripts.check_schema
      - name: Verify broker, persistence and recovery contracts
        run: >-
          python -m pytest tests/test_queue_lifecycle.py
          tests/test_job_lifecycle_resilience.py tests/test_commit_enqueue_reconciler.py
          --junitxml=test-results/integration.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-integration-results
          path: services/plagiarism-ai/test-results/*.xml

  docker:
    if: ${{ inputs.verify_image }}
    needs: [unit, integration]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify the Azure ARM64 image can build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/plagiarism-ai
          file: services/plagiarism-ai/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ai-arm64
          cache-to: type=gha,mode=max,scope=ai-arm64
