[extend]
useDefault = true

# These are document identifiers in historical reports, not authentication keys.
# Both the exact fields/values and the two source paths must match.
[[allowlists]]
description = "AI corpus document identifiers in imported report fixtures"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)services/plagiarism-ai/(docs/corpus-duplicate-audit\.md|tests/fixtures/sample_report_v3_violations\.json)$''']
regexes = [
  '''"(?:duplicate_key|canonical_key)":\s*"kltn-[0-9a-f]{16}"''',
  '''"source_key":\s*"kltn_tham_chieu_cv_02"''',
]
